[project]
name = "openclaw-hub"
version = "0.1.0"
description = "Web dashboard + MCP server for managing OpenClaw agent development"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "aiosqlite>=0.21",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "mcp[cli]>=1.9",
]

[project.scripts]
openclaw-hub = "hub.app:main"
oc-hub = "hub.cli:main"
openclaw-hub-mcp = "hub.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
