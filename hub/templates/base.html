<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OpenClaw Hub{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">OpenClaw<span>Hub</span></div>
        <nav>
            <a href="/" class="{% if active == 'dashboard' %}active{% endif %}">
                &#9632; Dashboard
            </a>
            <a href="/tasks" class="{% if active == 'tasks' %}active{% endif %}">
                &#9654; Tasks
            </a>
        </nav>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
